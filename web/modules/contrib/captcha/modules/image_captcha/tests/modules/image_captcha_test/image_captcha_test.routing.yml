image_captcha_test.default_type:
  path: '/captcha-test/image-test-default'
  defaults:
    _title: 'Test'
    _form: 'Drupal\image_captcha_test\Form\ImageCaptchaDefaultTypeTestForm'
  requirements:
    _permission: 'access content'
